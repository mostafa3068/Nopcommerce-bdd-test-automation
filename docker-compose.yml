version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "StrongPassw0rd!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nopcommerce-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "StrongPassw0rd!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nopcommerce:
    image: nopcommerceteam/nopcommerce:latest
    container_name: nopcommerce
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:80"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=nopcommerce;User Id=sa;Password=StrongPassw0rd!;TrustServerCertificate=True;"
    volumes:
      - nopcommerce_data:/app/App_Data
    networks:
      - nopcommerce-network

volumes:
  sqlserver_data:
  nopcommerce_data:

networks:
  nopcommerce-network:
    driver: bridge